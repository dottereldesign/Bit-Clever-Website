<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bit Clever Website</title>
  <meta name="theme-color" content="#ffffff">
  <style>
    * { box-sizing: border-box; }
    html { background: #fff; }
    body {
      margin: 0;
      padding: 8px;
    }
    .hero {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: calc(100vh - 96px);
      height: calc(100svh - 96px);
      border-radius: 24px;
      overflow: hidden;
      min-height: 240px;
      container-type: size;
      background: #123433;
    }
    .hero::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      /* The same palette remains visible before the precise canvas is ready. */
      background:
        radial-gradient(ellipse 36.265cqh 27.6292cqh at calc(100% + 16.745cqh) 33.5515%,
          rgb(23 177 130 / .8532) 0%, rgb(23 177 130 / .848) 25%,
          rgb(23 177 130 / .788) 50%, rgb(23 177 130 / .602) 75%,
          rgb(23 177 130 / .314) 100%, rgb(23 177 130 / .089) 125%,
          rgb(23 177 130 / .011) 150%, rgb(23 177 130 / 0) 180%),
        radial-gradient(ellipse 106.189cqh 96.4097cqh at 32.7591% 1.3574%,
          #123433 50.632%, #99ace5 100%);
    }
    .hero__background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    .hero__brand {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(1100px, 92cqw, 210cqh);
      aspect-ratio: 648 / 216;
      pointer-events: none;
      user-select: none;
    }
    .hero__character {
      position: absolute;
      left: 0;
      top: 0;
      width: 23.765432%;
      height: auto;
      display: block;
    }
    .hero__wordmark {
      position: absolute;
      left: 27.469136%;
      top: 3.703704%;
      width: 72.530864%;
      height: auto;
      display: block;
    }

    .noise-picker { position: fixed; right: 8px; bottom: 8px; z-index: 10; font: 14px/1.4 Arial,sans-serif; color: #eef4ff; }
    .noise-picker summary { cursor: pointer; padding: 12px 16px; border: 1px solid #ffffff40; border-radius: 12px; background: #123433ed; }
    .noise-options { position: absolute; right: 0; bottom: calc(100% + 8px); width: 260px; max-width: calc(100vw - 16px); max-height: calc(100svh - 80px); overflow: auto; padding: 6px; border-radius: 14px; background: #123433f5; box-shadow: 0 10px 36px #001b1940; }
    .noise-options button { display: block; width: 100%; min-height: 40px; padding: 9px 12px; border: 0; border-radius: 8px; text-align: left; font: inherit; color: inherit; background: transparent; cursor: pointer; }
    .noise-options button:hover { background: #ffffff12; }
    .noise-options button[aria-pressed="true"] { background: #99ace540; }
    .noise-picker :focus-visible { outline: 2px solid #d5e0ff; outline-offset: 2px; }

    .noise-tuning { padding: 10px 12px 14px; border-bottom: 1px solid #ffffff25; margin-bottom: 6px; }
    .noise-tuning label { display: flex; justify-content: space-between; margin-top: 8px; }
    .noise-tuning output { color: #c7d6ff; font-variant-numeric: tabular-nums; }
    .noise-tuning input { display: block; width: 100%; height: 28px; margin: 4px 0; accent-color: #99ace5; cursor: pointer; }

    .site-header { height: 72px; margin-bottom: 8px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; background: #fff; font-family: Arial, sans-serif; }
    .site-logo { display: block; flex: 0 1 180px; min-width: 0; text-decoration: none; }
    .site-logo img { display: block; width: 100%; height: auto; }
    .contact-cta { flex-shrink: 0; display: inline-flex; align-items: center; gap: 24px; min-height: 44px; padding: 12px 18px; border: 1px solid #161616; border-radius: 999px; color: #fff; background: #161616; font: 600 12px/1 Arial, sans-serif; letter-spacing: .04em; cursor: pointer; }
    .contact-cta:hover { background: #333; }
    .site-header :focus-visible { outline: 2px solid #526ab4; outline-offset: 4px; }
    @media (max-width: 480px) { .site-header { padding: 0 8px; } .site-logo { flex-basis: 144px; } .contact-cta { gap: 16px; } }
    #save-noise-default { margin-top: 8px; background: #99ace5; color: #123433; text-align: center; font-weight: 600; }
    #save-noise-default[hidden] { display: none; }
    #save-noise-default:disabled { opacity: .5; }
    #save-noise-status { font-size: 12px; margin: 8px 0 0; }
    #save-noise-status:empty { display: none; }
  </style>
  <script type="module" src="./assets/hero-background.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="./" aria-label="Bit Clever home"><img src="./assets/bit-clever-logo-black.svg" width="648" height="216" alt="Bit Clever" draggable="false"></a>
    <button class="contact-cta" type="button">LET'S TALK <span aria-hidden="true">&rarr;</span></button>
  </header>
  <main class="hero" aria-label="Bit Clever">
    <canvas class="hero__background" aria-hidden="true"></canvas>
    <div class="hero__brand" role="img" aria-label="Bit Clever: a white B character beside the Clever script wordmark, both with black eyes">
      <img class="hero__character" src="./assets/bit-clever-character.svg" width="154" height="216" alt="" draggable="false">
      <img class="hero__wordmark" src="./assets/clever-wordmark.svg" width="1264" height="478" alt="" draggable="false">
    </div>
  </main>
  <details class="noise-picker" hidden>
    <summary>Noise: <span id="noise-name">Original</span></summary>
    <div class="noise-options">
      <div class="noise-tuning" role="group" aria-label="Adjust noise">
        <label for="noise-strength">Strength <output id="strength-value" for="noise-strength">100%</output></label>
        <input id="noise-strength" type="range" min="0" max="4" step="0.05" value="1">
        <label for="noise-size">Size <output id="size-value" for="noise-size">1.00x</output></label>
        <input id="noise-size" type="range" min="0.25" max="4" step="0.05" value="1">
        <button id="save-noise-default" type="button" hidden>Save as default</button>
        <p id="save-noise-status" role="status"></p>
      </div>
      <div class="noise-presets" role="group" aria-label="Noise presets"></div>
    </div>
  </details>
</body>
</html>
