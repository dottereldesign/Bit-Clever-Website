<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bit Clever Website</title>
  <meta name="theme-color" content="#ffffff">
  <style>
    * { box-sizing: border-box; }
    html { background: #fff; --header-height: 72px; }
    body {
      margin: 0;
      padding: 8px;
    }
    .hero {
      position: relative;
      isolation: isolate;
      width: 100%;
      height: calc(100vh - var(--header-height) - 24px);
      height: calc(100svh - var(--header-height) - 24px);
      border-radius: 24px;
      overflow: hidden;
      min-height: 240px;
      container-type: size;
      background: #123433;
    }
    .hero::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      height: 100%;
      /* The same palette remains visible before the precise canvas is ready. */
      background:
        radial-gradient(ellipse 36.265cqh 27.6292cqh at calc(100% + 16.745cqh) 33.5515%,
          rgb(23 177 130 / .8532) 0%, rgb(23 177 130 / .848) 25%,
          rgb(23 177 130 / .788) 50%, rgb(23 177 130 / .602) 75%,
          rgb(23 177 130 / .314) 100%, rgb(23 177 130 / .089) 125%,
          rgb(23 177 130 / .011) 150%, rgb(23 177 130 / 0) 180%),
        radial-gradient(ellipse 106.189cqh 96.4097cqh at 32.7591% 1.3574%,
          #123433 50.632%, #99ace5 100%);
    }
    .hero__background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      pointer-events: none;
    }
    .hero__brand {
      position: absolute;
      z-index: 1;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(1100px, 92cqw, 210cqh);
      aspect-ratio: 456 / 130;
      user-select: none;
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .hero__brand:focus-visible { outline: 2px solid white; outline-offset: 12px; border-radius: 8px; }
    .hero__logo {
      display: block;
      width: 100%;
      height: auto;
    }
    .hero__brand[data-handwriting="waiting"] .hero__logo { visibility: hidden; }
    .hero__brand[data-handwriting="playing"] .hero__logo { visibility: hidden; }
    .hero__handwriting { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    .hero__bit-intro { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .hero__handwriting[hidden] { display: none; }
    @media (prefers-reduced-motion: reduce) {
      .hero__brand[data-handwriting] .hero__logo { clip-path: none; visibility: visible; }
      .hero__handwriting, .hero__bit-intro { display: none !important; }
    }

    .hero__message { position: absolute; z-index: 1; top: calc(50% + min(156.8px, 13.12cqw, 29.94cqh) + 18px); left: 0; width: 100%; margin: 0; text-align: center; color: white; font: 500 clamp(12px, 1.3vw, 16px)/1.4 Arial,sans-serif; letter-spacing: .22em; text-transform: uppercase; }
    .coming-soon { display: inline-block; opacity: 0; }
    .coming-soon > span { display: inline-block; white-space: pre; }
    .settings { position: fixed; right: 8px; bottom: 8px; z-index: 20; font: 14px Arial,sans-serif; }
    .settings summary { list-style: none; display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ffffff55; color: white; background: #123433ed; cursor: pointer; }
    .settings summary::-webkit-details-marker { display: none; }
    .settings-panel { position: absolute; right: 0; bottom: 52px; width: 220px; max-width: calc(100vw - 16px); padding: 8px; display: grid; gap: 4px; border: 1px solid #ffffff25; border-radius: 16px; background: #123433f5; box-shadow: 0 8px 24px #001b1920; }
    .settings select { width: 100%; min-height: 40px; padding: 8px 10px; border: 0; border-radius: 8px; color: #fff; background: #ffffff0a; font: inherit; cursor: pointer; color-scheme: dark; }
    .settings option { background: #123433; }
    .settings :focus-visible { outline: 2px solid #99ace5; outline-offset: 2px; }
    .site-header { height: var(--header-height); margin-bottom: 8px; padding: 0; display: grid; grid-template-columns: minmax(0,1fr) auto minmax(0,1fr); align-items: center; gap: 16px; background: #fff; font-family: Arial,sans-serif; }
    .site-logo { display: block; width: 180px; max-width: 100%; text-decoration: none; }
    .site-logo img { display: block; width: 100%; height: auto; }
    .header-nav { display: flex; align-items: center; justify-content: center; gap: 26px; }
    .header-nav a { color: #161616; font: 500 14px/1.4 Arial,sans-serif; text-decoration: none; white-space: nowrap; }
    .header-nav a:hover { text-decoration: underline; text-underline-offset: 5px; }
    .header-actions { justify-self: end; display: flex; align-items: center; gap: 22px; white-space: nowrap; }
    .call-cta { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0; border: 0; background: transparent; color: #161616; font: 500 13px/1 Arial,sans-serif; text-decoration: none; cursor: pointer; }
    .call-cta svg { width: 18px; height: 18px; flex-shrink: 0; }
    .quote-cta { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 12px 18px; border: 1px solid #000; border-radius: 999px; background: #000; color: #fff; font: 600 13px/1 Arial,sans-serif; text-decoration: none; cursor: pointer; }
    .quote-cta:hover { background: #262626; }
    .site-header :focus-visible { outline: 2px solid #526ab4; outline-offset: 4px; }
    @media (max-width: 1050px) {
      html { --header-height: 112px; }
      .site-header { grid-template-columns: minmax(0,1fr) auto; grid-template-rows: 64px 32px; gap: 8px 16px; }
      .header-actions { grid-column: 2; grid-row: 1; }
      .header-nav { grid-column: 1 / -1; grid-row: 2; }
    }
    @media (max-width: 480px) {
      .site-logo { width: 110px; }
      .site-header { column-gap: 8px; }
      .header-actions { gap: 12px; }
      .call-cta, .quote-cta { font-size: 11px; }
      .call-cta { gap: 5px; }
      .call-cta svg { width: 15px; height: 15px; }
      .quote-cta { padding: 12px; }
      .header-nav { gap: 16px; }
      .header-nav a { font-size: 12px; }
    }
  </style>
  <script type="module" src="./assets/hero-background.js"></script>
  <script type="module" src="./assets/logo-animation.js"></script>
  <noscript><style>.hero__brand[data-handwriting] .hero__logo { clip-path: none; visibility: visible; }.coming-soon { opacity: 1; }</style></noscript>
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="./" aria-label="Bit Clever home"><img src="./assets/bit-clever-logo-black.svg" width="456" height="130" alt="Bit Clever" draggable="false"></a>
    <nav class="header-nav" aria-label="Main navigation">
      <a href="#services">Services</a>
      <a href="#pricing">Pricing</a>
      <a href="#portfolio">Portfolio</a>
      <a href="#about">About</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="header-actions">
      <button class="call-cta" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 10a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>Call Me</button>
      <button class="quote-cta" type="button">Request a Quote</button>
    </div>
  </header>
  <main class="hero" aria-label="Bit Clever">
    <canvas class="hero__background" aria-hidden="true"></canvas>
    <button class="hero__brand" data-handwriting="waiting" type="button" aria-label="Replay Bit Clever handwriting animation" title="Click to replay the handwriting">
      <img class="hero__logo" src="./assets/bit-clever-logo-white.svg" width="456" height="130" alt="" draggable="false">
    </button>
    <p class="hero__message"><span class="coming-soon">Coming soon</span></p>
  </main>
  <details class="settings">
    <summary aria-label="Appearance settings" title="Appearance settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="#123433"/><circle cx="15" cy="17" r="3" fill="#123433"/></svg></summary>
    <div class="settings-panel">
      <select id="it-size" aria-label="it size"></select>
      <select id="bit-style" aria-label="Bit entrance"></select>
      <select id="eye-style" aria-label="Eye animation"></select>
      <select id="drawing-speed" aria-label="Drawing speed"></select>
      <select id="coming-style" aria-label="Coming soon entrance"></select>
      <select id="noise-preset" aria-label="Noise effect"></select>
    </div>
  </details>
  <script type="module">
    const menu = document.querySelector('.settings');
    document.addEventListener('pointerdown', event => { if (!menu.contains(event.target)) menu.open = false; });
    document.addEventListener('keydown', event => { if (event.key === 'Escape' && menu.open) { menu.open = false; menu.querySelector('summary').focus(); } });
  </script>
</body>
</html>
